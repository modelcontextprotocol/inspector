<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <!-- Isolation model: by default the inner iframe is sandboxed WITHOUT
         `allow-same-origin`, so the untrusted app runs under an opaque
         ("null") origin. That is the structural boundary — the app cannot
         touch this proxy's DOM, window, or cookies, so it cannot bypass its
         own CSP by executing in the parent's realm. The proxy itself is
         additionally served with a restrictive CSP header (see
         server/sandbox-controller.ts) so any future regression that re-grants
         same-origin still gains nothing. The default sandbox value
         ("allow-scripts allow-forms") may be narrowed per app via the
         resource-ready message's `sandbox` field; `allow-same-origin` is
         always stripped from a server-supplied value.

         Dedicated-origin exception (#2056): an app whose UI resource declares
         `_meta.ui.domain` is instead served from the host's own app-origin
         listener, handed to us as the resource-ready message's `src`. That
         frame IS granted `allow-same-origin` — an opaque origin sends
         `Origin: null`, which defeats the CORS / OAuth-callback / API-key
         allowlists the field exists to support. The boundary is preserved by
         the origin itself rather than by opacity: the listener is on its own
         port, so the app is cross-origin to this proxy and to the host, and
         the grant is refused outright if the URL's origin equals this page's.
         The grant is host-driven — it is never reachable from the server's
         own `sandbox` string, which is still stripped.

         Network/resource egress from the inner document is constrained by a
         Content-Security-Policy that the HOST builds and bakes into the
         delivered HTML before it reaches this proxy (see
         src/utils/sandbox-csp.ts). The proxy assigns that pre-wrapped document
         to `srcdoc` verbatim — it never parses or injects into the untrusted
         bytes — so the CSP `<meta>` is guaranteed to be the first `<head>`
         child of the inner document.

         Self-navigation: a sandboxed frame may always navigate ITSELF —
         `allow-top-navigation` governs other frames, not its own — and the
         sandbox flags follow it, so a page the app navigates to is still
         opaque ("null") and still `inner.contentWindow`. Nothing in the app's
         own CSP can stop that (CSP has no shipped navigation directive), so
         two controls here do instead:
           1. A `frame-src` / `child-src` policy on THIS document, installed
              per render before the inner frame is loaded (see
              `installFramePolicy`). A parent's `frame-src` governs every
              navigation of its child frame, including one the child starts,
              so the inner frame can load only the srcdoc (not a fetch, so not
              subject to it), the dedicated app origin, or the app's approved
              `frameDomains`. It is a <meta> rather than a header because the
              sources are only known once the resource-ready message arrives.
           2. Navigation detection (see `closeNavigatedFrame` and its
              callers): a navigation 1. refuses raises a policy violation on
              this document, and on the srcdoc path the frame leaving its
              document anyway (a navigation 1. allowed, such as to a declared
              frame domain) is reported by the host wrapper's departure
              script, and also shows as a second `load`. Any of them closes
              the relay, removes the frame and tells the host. This half is
              defense in depth, not the boundary: a navigated page's scripts
              can run before either signal arrives. -->
    <title>MCP-UI Proxy</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100vh;
        width: 100vw;
        /* Transparent background allows parent page to show through */
        background-color: transparent;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      * {
        box-sizing: border-box;
      }
      iframe {
        background-color: transparent;
        border: 0px none transparent;
        padding: 0px;
        overflow: hidden;
        flex-grow: 1;
        /* Inherit color scheme from parent for consistent transparency */
        color-scheme: inherit;
      }
    </style>
  </head>
  <body>
    <script>
      function buildAllowAttribute(permissions) {
        if (!permissions) return "";

        const allowList = [];
        if (permissions["camera"]) allowList.push("camera");
        if (permissions["microphone"]) allowList.push("microphone");
        if (permissions["geolocation"]) allowList.push("geolocation");
        if (permissions["clipboardWrite"]) allowList.push("clipboard-write");

        return allowList.join("; ");
      }

      // The approved `frameDomains` from the resource-ready message's `csp`
      // (the host has already filtered them; see approveCspSources in
      // src/utils/sandbox-csp.ts). Re-screened here because they become CSP
      // source expressions on THIS document: anything carrying whitespace, a
      // directive or list separator, or a quote (a keyword such as 'self',
      // which would name this proxy's own origin) is dropped.
      function approvedFrameSources(csp) {
        const list = csp && Array.isArray(csp.frameDomains) ? csp.frameDomains : [];
        return list.filter(
          (s) => typeof s === "string" && s !== "" && !/[\s;,'"]/.test(s),
        );
      }

      // Restrict what the inner frame may be navigated to, by installing a
      // `frame-src` / `child-src` policy on this document (see the head
      // comment for why a parent's policy is the control that works). Must run
      // BEFORE the inner frame starts its navigation. Policies only ever
      // intersect, so a second call can narrow but never widen what an
      // earlier one allowed — a re-render in the same proxy document fails
      // closed. `child-src` is set alongside so the restriction holds even in
      // a browser that falls back to it for frames; the srcdoc document
      // inherits this policy too, which is harmless because its own policy
      // already limits frames to the same `frameDomains` and workers to
      // 'none'.
      function installFramePolicy(sources) {
        const list = sources.length > 0 ? sources.join(" ") : "'none'";
        const meta = document.createElement("meta");
        meta.httpEquiv = "Content-Security-Policy";
        meta.content = `frame-src ${list}; child-src ${list}`;
        document.head.appendChild(meta);
      }

      // The exact embedder origins this proxy accepts, injected by the sandbox
      // controller when it serves this page (see `embedderOriginsLiteral` in
      // server/sandbox-controller.ts). It is the same list the served
      // `frame-ancestors` header admits, so the two checks agree by
      // construction — an https or public-hostname Inspector page is accepted
      // exactly when the backend's ALLOWED_ORIGINS names it (#1862).
      //
      // `null` means the controller had no valid list (a hand-constructed
      // caller or a test); the header then falls back to the loopback family,
      // and so does this check.
      const ALLOWED_EMBEDDER_ORIGINS = /*INSPECTOR_EMBEDDER_ORIGINS*/ null;
      const LOOPBACK_EMBEDDER_PATTERN =
        /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/;

      if (window.self === window.top) {
        throw new Error("This file is only to be used in an iframe sandbox.");
      }

      if (!document.referrer) {
        throw new Error("No referrer, cannot validate embedding site.");
      }

      // Compare the referrer's parsed ORIGIN, never the raw string: a pattern
      // over the full referrer is a prefix/substring match an attacker page's
      // path or query can be shaped to satisfy.
      let referrerOrigin = null;
      try {
        referrerOrigin = new URL(document.referrer).origin;
      } catch (e) {
        referrerOrigin = null;
      }

      if (
        !referrerOrigin ||
        !(Array.isArray(ALLOWED_EMBEDDER_ORIGINS)
          ? ALLOWED_EMBEDDER_ORIGINS.includes(referrerOrigin)
          : LOOPBACK_EMBEDDER_PATTERN.test(referrerOrigin))
      ) {
        throw new Error(
          `Embedding origin ${referrerOrigin} is not allowed to load the MCP Apps sandbox. Add it to the Inspector's ALLOWED_ORIGINS (e.g. ALLOWED_ORIGINS=https://inspector.example.com) and restart.`,
        );
      }

      // Extract the expected host origin from the referrer for origin validation.
      // This is the origin we expect all parent messages to come from.
      const EXPECTED_HOST_ORIGIN = new URL(document.referrer).origin;

      // The inner iframe is sandboxed without allow-same-origin by default, so
      // its document has an opaque origin and every postMessage from it arrives
      // with event.origin === "null" (the literal string). That value is
      // checked below as a defense-in-depth assertion; the actual identity
      // proof is `event.source === inner.contentWindow`, which a sibling
      // frame cannot forge.
      //
      // The dedicated-origin path (#2056) is the one exception: when the host
      // supplies a `src` on its own app-origin listener, the frame is granted
      // allow-same-origin so the app has a REAL origin — which is the entire
      // point, since an opaque origin sends `Origin: null` and defeats any
      // CORS / OAuth-callback / API-key allowlist the app's backend applies.
      // `innerOrigin` is then that URL's origin, and the assertion above still
      // holds against it.
      let innerOrigin = "null";

      // Security self-test: verify iframe isolation is working correctly.
      // This MUST throw a SecurityError -- if `window.top` is accessible, the sandbox
      // configuration is dangerously broken and untrusted content could escape.
      try {
        window.top?.alert(
          "If you see this, the sandbox is not setup securely.",
        );
        throw "FAIL";
      } catch (e) {
        if (e === "FAIL") {
          throw new Error("The sandbox is not setup securely.");
        }

        // Expected: SecurityError confirms proper sandboxing.
      }

      // Double-iframe sandbox architecture: THIS file is the outer sandbox proxy
      // iframe on a separate origin. It creates an inner iframe for untrusted HTML
      // content. Per the specification, the Host and the Sandbox MUST have different
      // origins.
      const inner = document.createElement("iframe");
      inner.style = "width:100%; height:100%; border:none;";
      inner.setAttribute("sandbox", "allow-scripts allow-forms");
      // Note: allow attribute is set later when receiving sandbox-resource-ready notification
      // based on the permissions requested by the app
      document.body.appendChild(inner);

      // Set once the inner frame is seen leaving the document the host loaded.
      // From then on the relay is closed in both directions and every message
      // is dropped: whatever the frame holds is no longer the app, even though
      // it still satisfies `event.source === inner.contentWindow` and still
      // serialises its origin as "null".
      let navigatedAway = false;

      // Fail closed on a frame that tried to leave its document: stop
      // relaying, remove the frame (which destroys whatever document it
      // holds), and tell the host through the app's own logging channel,
      // which it already surfaces. Idempotent, because one attempt can be
      // seen twice (a blocked navigation is both a policy violation and, in
      // Chromium, a second `load` onto an error page).
      function closeNavigatedFrame(what) {
        if (navigatedAway) return;
        navigatedAway = true;
        inner.remove();
        console.error(
          `[Sandbox] the app ${what}; the frame was removed and the relay closed.`,
        );
        window.parent.postMessage(
          {
            jsonrpc: "2.0",
            method: "notifications/message",
            params: {
              level: "error",
              logger: "mcp-inspector-sandbox",
              data: `The MCP App ${what}. The Inspector removed the frame and stopped relaying messages; reload the app to try again.`,
            },
          },
          EXPECTED_HOST_ORIGIN,
        );
      }

      // A navigation the frame policy (installFramePolicy) refuses is
      // reported HERE, on the policy's own document. Engines differ in what
      // follows: Chromium commits an error page (a second `load`), while
      // Firefox leaves the original document in place and fires nothing
      // further. The violation is the one signal both give, so it is what
      // makes the attempt visible to the host everywhere. The app's own
      // nested-frame violations are reported to the app's document, not
      // this one, so they do not reach this listener.
      document.addEventListener("securitypolicyviolation", (e) => {
        if (
          e.effectiveDirective === "frame-src" ||
          e.effectiveDirective === "child-src"
        ) {
          closeNavigatedFrame(
            "tried to navigate its frame to an origin it did not declare",
          );
        }
      });

      // Watch a srcdoc load for the frame navigating itself elsewhere. The
      // srcdoc document fires at most one `load`, so any later one is a
      // different document — another page (one the frame policy allowed,
      // such as a declared frame domain), a blocked navigation's error page,
      // or a reload. All of them close the frame. A navigation started while
      // the srcdoc is still loading aborts it before its `load`, so the next
      // document's `load` is the FIRST one; that case is caught by the
      // departure message instead (see DEPARTURE_MESSAGE_KEY).
      //
      // The frame is detached while it is configured and re-attached after
      // the listener is on, so the only `load` it can fire first is the
      // srcdoc's: inserting a frame that already carries `srcdoc` skips the
      // initial about:blank `load` that a bare frame would fire, which is what
      // makes "the second load" unambiguous across engines.
      function loadSrcdocWatchingForNavigation(html) {
        inner.remove();
        inner.srcdoc = html;
        let loads = 0;
        inner.addEventListener("load", function onLoad() {
          loads += 1;
          if (loads === 1) return;
          inner.removeEventListener("load", onLoad);
          closeNavigatedFrame(
            "navigated its frame away from the document the host loaded",
          );
        });
        document.body.appendChild(inner);
      }

      // The host wrapper (wrapSandboxedHtml in src/utils/sandbox-csp.ts)
      // runs a script ahead of the app's code that posts
      // `{ mcpInspectorSandbox: "departing" }` when the srcdoc document starts
      // to leave (`beforeunload` / `pagehide`), whether or not it ever
      // finished loading. It is consumed here and never relayed.
      const DEPARTURE_MESSAGE_KEY = "mcpInspectorSandbox";

      const RESOURCE_READY_NOTIFICATION =
        "ui/notifications/sandbox-resource-ready";
      const PROXY_READY_NOTIFICATION = "ui/notifications/sandbox-proxy-ready";

      // Message relay: This Sandbox (outer iframe) acts as a bidirectional bridge,
      // forwarding messages between:
      //
      //   Host (parent window) ↔ Sandbox (outer frame) ↔ View (inner iframe)
      //
      // Reason: the parent window and inner iframe have different origins and can't
      // communicate directly, so the outer iframe forwards messages in both
      // directions to connect them.
      //
      // Special case: The "ui/notifications/sandbox-proxy-ready" message is
      // intercepted here (not relayed) because the Sandbox uses it to configure and
      // load the inner iframe with the view HTML content.
      //
      // Security: isolation comes from the iframe `sandbox` attribute and the
      // origin allowlist above. The CSP for the inner document is built and
      // wrapped by the host before the HTML reaches this proxy (see head
      // comment); this script writes that pre-wrapped document verbatim and
      // never parses or injects into the untrusted bytes.

      window.addEventListener("message", async (event) => {
        // Closed for good once the frame navigated away (see
        // loadSrcdocWatchingForNavigation): nothing is relayed either way.
        if (navigatedAway) return;
        if (event.source === window.parent) {
          // Validate that messages from parent come from the expected host origin.
          // This prevents malicious pages from sending messages to this sandbox.
          if (event.origin !== EXPECTED_HOST_ORIGIN) {
            console.error(
              "[Sandbox] Rejecting message from unexpected origin:",
              event.origin,
              "expected:",
              EXPECTED_HOST_ORIGIN,
            );
            return;
          }

          if (event.data && event.data.method === RESOURCE_READY_NOTIFICATION) {
            const { html, sandbox, permissions, src, csp } = event.data.params;
            // The host asked for the dedicated-origin path: it published the
            // wrapped document to its own app-origin listener and is handing
            // us the URL. Only an absolute http(s) URL is honored — anything
            // else (a relative path, a `javascript:` or `data:` URL) falls
            // through to the srcdoc path below rather than being navigated to.
            let srcUrl = null;
            if (typeof src === "string") {
              try {
                const parsed = new URL(src);
                if (parsed.protocol === "http:" || parsed.protocol === "https:") {
                  srcUrl = parsed;
                } else {
                  console.warn("[Sandbox] ignoring non-http(s) src:", src);
                }
              } catch (e) {
                console.warn("[Sandbox] ignoring unparseable src:", src);
              }
            }
            // The app origin MUST differ from BOTH trusted origins — this
            // proxy's own and the Inspector page above it. Granting
            // allow-same-origin below is what makes the app's origin real, and
            // an app sharing the proxy's origin would land in this realm
            // outright; one sharing the HOST's origin is no better, since
            // same-origin with the top document means direct access to
            // `window.top`, its DOM and its storage — the cross-origin frame in
            // between buys nothing once the inner document is same-origin with
            // the thing it is trying to reach. Either is a host
            // misconfiguration, not app input, so refuse rather than degrade
            // quietly.
            if (
              srcUrl &&
              (srcUrl.origin === window.location.origin ||
                srcUrl.origin === EXPECTED_HOST_ORIGIN)
            ) {
              console.error(
                "[Sandbox] refusing a src on a trusted origin:",
                srcUrl.origin,
              );
              srcUrl = null;
            }
            if (typeof sandbox === "string") {
              // Never grant allow-same-origin even if the server asks for it —
              // that would let the untrusted app reach this proxy's DOM and
              // bypass its own CSP via window.parent. Sandbox tokens are
              // ASCII case-insensitive, so compare lowercased.
              const safeTokens = sandbox
                .split(/\s+/)
                .filter((t) => t && t.toLowerCase() !== "allow-same-origin");
              // Fail-closed but noisy: a server-supplied sandbox that omits
              // allow-scripts leaves the inner frame unable to run the app.
              // That's safe, but silently bricks the widget — log it so a
              // developer can see why their app never started.
              if (!safeTokens.some((t) => t.toLowerCase() === "allow-scripts")) {
                console.warn(
                  "[Sandbox] server-supplied sandbox has no allow-scripts; the app will not execute:",
                  safeTokens.join(" "),
                );
              }
              inner.setAttribute("sandbox", safeTokens.join(" "));
            }
            if (srcUrl) {
              // Re-grant what the strip above removes unconditionally. Safe
              // here and only here: the document is served from a DIFFERENT
              // origin than this proxy (asserted above), so same-origin policy
              // still denies it this realm's DOM — it gains its own origin,
              // not ours.
              const tokens = (inner.getAttribute("sandbox") || "")
                .split(/\s+/)
                .filter(Boolean);
              if (!tokens.some((t) => t.toLowerCase() === "allow-same-origin")) {
                tokens.push("allow-same-origin");
              }
              inner.setAttribute("sandbox", tokens.join(" "));
            }
            // Set Permission Policy allow attribute if permissions are requested
            const allowAttribute = buildAllowAttribute(permissions);
            if (allowAttribute) {
              console.log("[Sandbox] Setting allow attribute:", allowAttribute);
              inner.setAttribute("allow", allowAttribute);
            }
            if (srcUrl) {
              // Navigate to the host's app-origin URL. The per-app CSP is
              // delivered as a real response header there (stronger than the
              // <meta> the srcdoc path relies on), so no wrapping applies here
              // — this proxy still never parses the untrusted bytes.
              //
              // Drop any `srcdoc` a previous render left behind first: it takes
              // precedence over `src`, so a frame that had rendered an opaque
              // document would keep showing it and never load this URL. Not
              // reachable today (each render remounts the iframe, which reloads
              // this document), but the cost of being wrong about that later is
              // an app silently rendering the wrong bytes.
              inner.removeAttribute("srcdoc");
              innerOrigin = srcUrl.origin;
              // The frame may hold only the app-origin document. That
              // document's own nested frames are governed by its own header
              // (it is not srcdoc, so it does not inherit this policy).
              installFramePolicy([srcUrl.origin]);
              inner.src = srcUrl.href;
            } else if (typeof html === "string") {
              // The host has already wrapped the app's HTML in a fixed shell
              // whose first <head> child is the CSP <meta>; assign it verbatim.
              // srcdoc is the only delivery path that works without
              // allow-same-origin (document.open/write would require reaching
              // into the inner contentDocument across the opaque-origin
              // boundary). Known trade-off: a small set of libraries (e.g.
              // CesiumJS Map) don't initialise correctly under srcdoc — that
              // is accepted in exchange for the isolation guarantee.
              //
              // Restore the opaque-origin posture first. A frame that
              // previously took the dedicated-origin path still carries
              // `allow-same-origin`, and `innerOrigin` still names that origin;
              // assigning `srcdoc` under those would put the untrusted document
              // in THIS proxy's realm — the exact escape the double-iframe
              // model exists to prevent. The sandbox attribute is read at
              // navigation time and assigning `srcdoc` is the navigation, so
              // stripping it here takes effect for the document being loaded.
              const fallbackTokens = (inner.getAttribute("sandbox") || "")
                .split(/\s+/)
                .filter((t) => t && t.toLowerCase() !== "allow-same-origin");
              inner.setAttribute("sandbox", fallbackTokens.join(" "));
              innerOrigin = "null";
              // The srcdoc load itself is not a fetch, so `frame-src` does not
              // apply to it; what it does stop is the frame being navigated to
              // anything but the app's approved `frameDomains` afterwards.
              installFramePolicy(approvedFrameSources(csp));
              loadSrcdocWatchingForNavigation(html);
            }
          } else {
            if (inner && inner.contentWindow) {
              // Target the inner frame's real origin on the dedicated-origin
              // path, so a frame that navigated itself elsewhere stops
              // receiving host messages. The opaque default has no targetable
              // origin ("null" is not a valid targetOrigin), so it has to use
              // "*" — which on its own would deliver to WHATEVER document the
              // frame holds: a sandboxed frame can navigate itself to another
              // origin without allow-top-navigation, and the new page keeps the
              // opaque origin and the same contentWindow. What keeps "*" from
              // reaching such a page is the frame policy (installFramePolicy),
              // which blocks the navigation, and the navigation watch, which
              // closes this relay if the frame leaves its document anyway.
              inner.contentWindow.postMessage(
                event.data,
                innerOrigin === "null" ? "*" : innerOrigin,
              );
            }
          }
        } else if (event.source === inner.contentWindow) {
          // `event.source === inner.contentWindow` is the unforgeable identity
          // check — only the actual inner frame can satisfy it. The opaque
          // sandbox means its origin serialises as the literal string "null";
          // assert that as defense-in-depth so a future change that
          // accidentally re-grants allow-same-origin is caught here.
          if (event.origin !== innerOrigin) {
            console.error(
              "[Sandbox] Rejecting message from inner iframe with unexpected origin:",
              event.origin,
              "expected:",
              innerOrigin,
            );
            return;
          }
          if (event.data && event.data[DEPARTURE_MESSAGE_KEY] === "departing") {
            // Only the opaque srcdoc path watches for departure: a
            // dedicated-origin app is targeted by its real origin instead.
            if (innerOrigin === "null") {
              closeNavigatedFrame(
                "navigated its frame away from the document the host loaded",
              );
            }
            return;
          }
          // Relay messages from inner frame to parent window.
          // Use specific origin instead of "*" to prevent message interception.
          window.parent.postMessage(event.data, EXPECTED_HOST_ORIGIN);
        }
      });

      // Notify the Host that the Sandbox is ready to receive view HTML.
      // Use specific origin instead of "*" to ensure only the expected host receives this.
      window.parent.postMessage(
        {
          jsonrpc: "2.0",
          method: PROXY_READY_NOTIFICATION,
          params: {},
        },
        EXPECTED_HOST_ORIGIN,
      );
    </script>
  </body>
</html>
