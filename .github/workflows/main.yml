# `v1/main` is the deprecated maintenance line: it publishes straight from this
# branch to the `v1-latest` dist-tag and never merges into `main`, which now
# carries v2. Keep these filters pinned to `v1/main` — a stale `main` entry here
# describes a topology that no longer exists, and would start matching the moment
# anything put a v1-shaped tree back on that branch.
#
# (For `push`, GitHub runs the workflow file from the pushed commit, so this file
# is only ever consulted for `v1/main` regardless. The filter states intent.)
on:
  push:
    branches:
      - v1/main
  pull_request:
    branches:
      - v1/main
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      # Working around https://github.com/npm/cli/issues/4828
      # - run: npm ci
      - run: npm install --no-package-lock

      - name: Check formatting
        run: npm run prettier-check

      - name: Check version consistency
        run: npm run check-version

      - name: Check linting
        working-directory: ./client
        run: npm run lint

      - name: Run client tests
        working-directory: ./client
        run: npm test

      - name: Run server tests
        working-directory: ./server
        run: npm test

      - run: npm run build

  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment: release
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # Working around https://github.com/npm/cli/issues/4828
      # - run: npm ci
      - run: npm install --no-package-lock

      # OIDC trusted publishing requires npm >=11.5.1; Node 22's bundled npm is 10.x.
      - name: Ensure npm CLI supports OIDC trusted publishing
        run: npm install -g npm@^11.5.1

      # `publish-all` pins `--tag v1-latest` on all four packages.
      #
      # Do NOT drop the flag: without an explicit tag npm assigns `latest`, so a
      # v1 security release would drag `latest` back from v2 and every
      # `npx @modelcontextprotocol/inspector` would silently get deprecated v1.
      #
      # Do NOT "simplify" the tag to `v1`: npm rejects any dist-tag that parses
      # as a SemVer range, and `v1` does (`npm error Tag name must not be a
      # valid SemVer range: v1`). That would fail the publish outright.
      - run: npm run publish-all
        env:
          NPM_CONFIG_PROVENANCE: "true"

  # Deprecate exactly what `publish` just published (#2104). `npm deprecate` is
  # a point-in-time write to the versions matching when it runs, not a standing
  # rule, so without this every v1 release lands un-deprecated (1.0.2 did, and
  # had to be fixed by hand).
  #
  # A job of its own, not a step after `publish-all`: if deprecation fails
  # (missing token, registry error), "Re-run failed jobs" must retry only this.
  # As a step, the retry would re-run `publish-all`, which npm rejects for an
  # already-published version, so deprecation could never be reached again.
  # Because it references `release`, its required reviewers approve this job
  # separately from `publish`.
  deprecate-npm:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment: release
    needs: publish

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      # registry-url writes the .npmrc that reads NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          registry-url: "https://registry.npmjs.org"

      # Do NOT widen this to a range. `<2.0.0` matches the v2 prereleases too
      # (`2.0.0-rc.1` sorts below `2.0.0`) and would stamp them with a v1
      # notice; the prerelease-safe spelling is `<2.0.0-0`, but the exact
      # version is idempotent and cannot rot, which is why it is used here.
      #
      # Auth: OIDC trusted publishing covers `npm publish` only; `npm deprecate`
      # is an ordinary authenticated write, so it needs a token. That token is
      # a granular one scoped to the four inspector packages, stored as an
      # environment secret on `release` (behind its required reviewers).
      #
      # MSG must stay byte-identical to the message already on every v1
      # version (`npm view @modelcontextprotocol/inspector@1.0.4 deprecated`).
      # The runtime banners in cli/src/cli.ts, server/src/index.ts and
      # client/bin/start.js say the same thing in different words — keep
      # their intent in sync if this changes.
      - name: Deprecate the published v1 packages
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          MSG="v1 is deprecated. Upgrade to v2: npm i @modelcontextprotocol/inspector@latest. v1 gets security fixes only, published under the v1-latest tag."
          # An empty message LIFTS deprecation — fail rather than un-deprecate.
          [ -n "$MSG" ] || { echo "::error::refusing to run with an empty deprecation message"; exit 1; }
          # Only ever a v1 version: this step must never touch a v2 release.
          [[ "$VERSION" =~ ^1\. ]] || { echo "::error::refusing to deprecate non-v1 version ${VERSION}"; exit 1; }
          [ -n "${NODE_AUTH_TOKEN:-}" ] || { echo "::error::NPM_DEPRECATE_TOKEN is not set on the release environment; ${VERSION} was published but NOT deprecated"; exit 1; }
          for pkg in inspector inspector-cli inspector-client inspector-server; do
            npm deprecate "@modelcontextprotocol/${pkg}@${VERSION}" "$MSG"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DEPRECATE_TOKEN }}

  publish-github-container-registry:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment: release
    needs: build
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
